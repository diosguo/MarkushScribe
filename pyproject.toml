[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markushscribe"
version = "0.0.1"
description = "Image-to-graph Markush structure recognition"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gen = ["rdkit>=2024.3"]
ml = ["torch", "timm", "pyyaml", "tensorboardX"]
baseline = [
    "numpy",
    "pillow",
    "rdkit>=2024.3",
    "pandas",
    "matplotlib",
    "opencv-python-headless",
    "albumentations==1.1.0",
    "SmilesPE==0.0.3",
    "OpenNMT-py==2.2.0",
]
dev = ["pytest>=7", "ruff>=0.5", "numpy", "pillow", "rdkit>=2024.3"]

[tool.setuptools.packages.find]
include = ["markushscribe*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["MolScribe", "data", "ckpts", "runs", "*.egg-info", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: long-running training/overfit tests"]
